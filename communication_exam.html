<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通信专业技术人员职业水平考试（初级）题库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .sidebar h3 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .nav-item {
            display: block;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: #667eea;
            color: white;
        }

        .stats {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
        }

        .content-area {
            flex: 1;
            min-width: 500px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .question-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #667eea;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-type {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .type-single {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .type-multi {
            background: #e3f2fd;
            color: #1565c0;
        }

        .type-judge {
            background: #fff3e0;
            color: #ef6c00;
        }

        .question-number {
            font-size: 14px;
            color: #666;
        }

        .question-text {
            font-size: 16px;
            color: #333;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .option-item:hover {
            background: #e3f2fd;
            border-color: #90caf9;
        }

        .option-item.selected {
            background: #e8f5e9;
            border-color: #66bb6a;
        }

        .option-item.correct {
            background: #e8f5e9 !important;
            border-color: #66bb6a !important;
        }

        .option-item.wrong {
            background: #ffebee !important;
            border-color: #ef5350 !important;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            font-weight: bold;
            font-size: 14px;
        }

        .option-text {
            font-size: 15px;
            color: #333;
            padding-top: 4px;
        }

        .option-item.selected .option-letter {
            background: #66bb6a;
        }

        .option-item.correct .option-letter {
            background: #66bb6a;
        }

        .option-item.wrong .option-letter {
            background: #ef5350;
        }

        .answer-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .answer-section.show {
            display: block;
        }

        .answer-correct {
            background: #e8f5e9;
            border-left: 4px solid #66bb6a;
        }

        .answer-wrong {
            background: #ffebee;
            border-left: 4px solid #ef5350;
        }

        .answer-header {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .answer-correct .answer-header {
            color: #2e7d32;
        }

        .answer-wrong .answer-header {
            color: #c62828;
        }

        .answer-content {
            color: #555;
            line-height: 1.7;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #66bb6a;
            color: white;
        }

        .btn-success:hover {
            background: #4caf50;
        }

        .btn-danger {
            background: #ef5350;
            color: white;
        }

        .btn-danger:hover {
            background: #e53935;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .exam-mode {
            background: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ff9800;
        }

        .exam-mode h4 {
            color: #e65100;
            margin-bottom: 10px;
        }

        .exam-info {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }

        .result-card {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-top: 30px;
        }

        .result-score {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .result-text {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .result-details {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-value {
            font-size: 24px;
            font-weight: bold;
        }

        .detail-label {
            font-size: 14px;
            opacity: 0.8;
        }

        .wrong-list {
            list-style: none;
        }

        .wrong-item {
            padding: 15px;
            background: #fff3e0;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ff9800;
        }

        .wrong-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .wrong-item a:hover {
            text-decoration: underline;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .filter-tab:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #ef5350;
            text-align: center;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .content-area {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📡 通信专业技术人员职业水平考试（初级）题库</h1>
            <p>涵盖通信基础、传输系统、交换技术、接入网、移动通信、数据通信等核心知识</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>📚 学习导航</h3>
                <div class="nav-item active" onclick="switchTab('practice')">📝 章节练习</div>
                <div class="nav-item" onclick="switchTab('exam')">🎯 模拟考试</div>
                <div class="nav-item" onclick="switchTab('wrong')">❌ 错题集</div>
                <div class="nav-item" onclick="switchTab('review')">📋 复习进度</div>
                <div class="nav-item" onclick="switchTab('knowledge')">📖 知识点复习</div>
                <div class="nav-item" onclick="switchTab('guide')">📝 题型解读</div>

                <div class="stats">
                    <h4>📊 学习统计</h4>
                    <div class="stat-item">
                        <span class="stat-label">总题数</span>
                        <span class="stat-value" id="stat-total">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">已做题</span>
                        <span class="stat-value" id="stat-done">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">正确率</span>
                        <span class="stat-value" id="stat-accuracy">0%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">错题数</span>
                        <span class="stat-value" id="stat-wrong">0</span>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div id="tab-practice" class="tab-content active">
                    <div class="filter-tabs">
                        <div class="filter-tab active" onclick="filterQuestions('all')">全部</div>
                        <div class="filter-tab" onclick="filterQuestions('single')">单选题</div>
                        <div class="filter-tab" onclick="filterQuestions('multi')">多选题</div>
                        <div class="filter-tab" onclick="filterQuestions('judge')">判断题</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="practice-progress"></div>
                    </div>
                    <div class="progress-text" id="practice-text"></div>
                    <div id="question-container"></div>
                </div>

                <div id="tab-exam" class="tab-content">
                    <div class="exam-mode">
                        <h4>🎯 模拟考试模式</h4>
                        <div class="exam-info">
                            <span>⏱️ 考试时长：60分钟</span>
                            <span>📝 题目数量：30题</span>
                            <span>💯 满分：100分</span>
                        </div>
                    </div>
                    <div class="timer" id="exam-timer">60:00</div>
                    <button class="btn btn-primary" onclick="startExam()" id="start-exam-btn">开始考试</button>
                    <div id="exam-container" style="display: none;"></div>
                    <div id="exam-result" style="display: none;"></div>
                </div>

                <div id="tab-wrong" class="tab-content">
                    <h3 style="margin-bottom: 20px;">❌ 错题集</h3>
                    <button class="btn btn-danger" onclick="clearWrongQuestions()" style="margin-bottom: 20px;">清空错题集</button>
                    <div id="wrong-container"></div>
                </div>

                <div id="tab-review" class="tab-content">
                    <h3 style="margin-bottom: 20px;">📋 复习进度</h3>
                    <div id="review-container"></div>
                </div>

                <div id="tab-knowledge" class="tab-content">
                    <h3 style="margin-bottom: 20px;">📖 知识点复习</h3>
                    <div class="filter-tabs" style="margin-bottom: 25px;">
                        <div class="filter-tab active" onclick="filterKnowledge('all')">全部</div>
                        <div class="filter-tab" onclick="filterKnowledge('基础')">通信基础</div>
                        <div class="filter-tab" onclick="filterKnowledge('传输')">传输系统</div>
                        <div class="filter-tab" onclick="filterKnowledge('交换')">交换技术</div>
                        <div class="filter-tab" onclick="filterKnowledge('接入')">接入网</div>
                        <div class="filter-tab" onclick="filterKnowledge('移动')">移动通信</div>
                        <div class="filter-tab" onclick="filterKnowledge('数据')">数据通信</div>
                    </div>
                    <div id="knowledge-container"></div>
                </div>

                <div id="tab-guide" class="tab-content">
                    <h3 style="margin-bottom: 20px;">📝 初级考试题型解读</h3>
                    <div id="guide-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const knowledgePoints = [
            {
                id: 1,
                category: '基础',
                chapter: '通信基础',
                title: 'OSI七层模型',
                content: 'OSI（Open Systems Interconnection）参考模型将网络通信功能划分为七层，从下到上依次为：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。每层负责特定的功能，并通过接口与相邻层通信。',
                keyPoints: ['物理层：负责物理介质上的比特传输', '数据链路层：负责帧的传输和差错控制', '网络层：负责路由和分组转发', '传输层：负责端到端的可靠传输', '应用层：为应用程序提供网络服务']
            },
            {
                id: 2,
                category: '基础',
                chapter: '通信基础',
                title: 'TCP/IP协议栈',
                content: 'TCP/IP协议栈是互联网的核心协议套件，分为四层：网络接口层、网络层（IP）、传输层（TCP/UDP）、应用层。TCP提供面向连接的可靠传输，UDP提供无连接的不可靠传输。',
                keyPoints: ['IP协议：负责分组路由和转发', 'TCP协议：可靠的面向连接传输', 'UDP协议：无连接的快速传输', 'HTTP/FTP/DNS：应用层协议']
            },
            {
                id: 3,
                category: '基础',
                chapter: '通信基础',
                title: '调制与编码',
                content: '调制是将数字信号转换为模拟信号的过程，常见方式包括ASK、FSK、PSK、QAM等。编码是将模拟信号转换为数字信号的过程，如PCM编码。',
                keyPoints: ['ASK：幅移键控', 'FSK：频移键控', 'PSK：相移键控', 'QAM：正交幅度调制', 'PCM：脉冲编码调制']
            },
            {
                id: 4,
                category: '基础',
                chapter: '通信基础',
                title: '多路复用技术',
                content: '多路复用技术允许多个信号共享同一传输介质，提高传输效率。常见方式包括频分复用（FDM）、时分复用（TDM）、波分复用（WDM）、码分复用（CDM）。',
                keyPoints: ['FDM：按频率划分信道', 'TDM：按时间划分信道', 'WDM：光纤通信中的波分复用', 'CDM：码分多址']
            },
            {
                id: 5,
                category: '传输',
                chapter: '传输系统',
                title: '光纤通信系统',
                content: '光纤通信系统由光发射机、光纤、光接收机组成。光纤具有低损耗、高带宽、抗电磁干扰等优点，是现代通信的主要传输介质。',
                keyPoints: ['工作波长：850nm、1310nm、1550nm', '单模光纤：纤芯直径约9μm，传输距离远', '多模光纤：纤芯直径50/62.5μm，传输距离近', '光放大器：EDFA用于长距离传输']
            },
            {
                id: 6,
                category: '传输',
                chapter: '传输系统',
                title: 'SDH同步数字体系',
                content: 'SDH是一种标准化的数字传输体系，具有统一的帧结构和传输速率等级。STM-1是基本速率等级，速率为155.520 Mbit/s。',
                keyPoints: ['STM-1：155.520 Mbit/s', 'STM-4：622.080 Mbit/s', 'STM-16：2.488 Gbit/s', '帧结构：9行×270列']
            },
            {
                id: 7,
                category: '传输',
                chapter: '传输系统',
                title: 'WDM波分复用',
                content: 'WDM技术在一根光纤中同时传输多个不同波长的光信号，每个波长承载一路独立的信号。密集波分复用（DWDM）可复用更多波长。',
                keyPoints: ['单根光纤传输多个波长', 'DWDM：波长间隔窄，复用密度高', 'C波段：1530-1565nm', 'L波段：1565-1625nm']
            },
            {
                id: 8,
                category: '传输',
                chapter: '传输系统',
                title: '微波与卫星通信',
                content: '微波通信利用微波频段进行通信，卫星通信利用人造卫星作为中继站。卫星通信覆盖范围广，适用于广播和远距离通信。',
                keyPoints: ['同步卫星：轨道高度约35786km', '自由空间损耗：与距离平方和频率平方成正比', 'Ka频段：频率高，损耗大，带宽大', '雨衰：影响卫星通信质量']
            },
            {
                id: 9,
                category: '交换',
                chapter: '交换技术',
                title: '电路交换',
                content: '电路交换在通信前建立专用的物理连接，通信期间独占资源。特点是时延小、实时性好，但资源利用率低。',
                keyPoints: ['面向连接', '资源独占', '时延固定', '适用于语音业务']
            },
            {
                id: 10,
                category: '交换',
                chapter: '交换技术',
                title: '分组交换',
                content: '分组交换将数据分割成分组进行传输，每个分组独立路由。特点是资源共享、灵活高效，但存在时延抖动。',
                keyPoints: ['无连接或面向连接', '资源共享', '统计复用', '适用于数据业务']
            },
            {
                id: 11,
                category: '交换',
                chapter: '交换技术',
                title: '软交换与IMS',
                content: '软交换将呼叫控制与媒体网关分离，IMS（IP多媒体子系统）提供基于IP的多媒体业务。两者共同构成下一代网络的核心。',
                keyPoints: ['软交换：控制与承载分离', 'IMS：IP多媒体子系统', 'SIP：会话初始协议', '统一通信：语音、视频、数据融合']
            },
            {
                id: 12,
                category: '接入',
                chapter: '接入网',
                title: 'xDSL技术',
                content: 'xDSL（数字用户线）技术利用现有电话线提供高速数据传输。ADSL是非对称的，上行速率低于下行速率。',
                keyPoints: ['ADSL：非对称数字用户线', '上行：最高1Mbps', '下行：最高24Mbps', 'VDSL：更高速率的DSL技术']
            },
            {
                id: 13,
                category: '接入',

        function getWrongQuestions() {
            const wrong = [];
            for (const [id, answer] of Object.entries(userAnswers)) {
                const question = allQuestions.find(q => q.id === parseInt(id));
                if (question) {
                    const isCorrect = Array.isArray(question.answer)
                        ? arraysEqual(answer, question.answer)
                        : answer === question.answer;
                    if (!isCorrect) {
                        wrong.push(question);
                    }
                }
            }
            return wrong;
        }

        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            return a.every((val, idx) => val === b[idx]);
        }

        function updateStats() {
            const total = allQuestions.length;
            const done = Object.keys(userAnswers).length;
            
            let correctCount = 0;
            for (const [id, answer] of Object.entries(userAnswers)) {
                const question = allQuestions.find(q => q.id === parseInt(id));
                if (question) {
                    const isCorrect = Array.isArray(question.answer)
                        ? arraysEqual(answer.sort(), question.answer.sort())
                        : answer === question.answer;
                    if (isCorrect) correctCount++;
                }
            }

            const accuracy = done > 0 ? Math.round((correctCount / done) * 100) : 0;
            const wrong = done - correctCount;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-accuracy').textContent = accuracy + '%';
            document.getElementById('stat-wrong').textContent = wrong;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');

            if (tabName === 'practice') {
                renderQuestion();
            } else if (tabName === 'wrong') {
                renderWrongQuestions();
            } else if (tabName === 'review') {
                renderReview();
            } else if (tabName === 'knowledge') {
                renderKnowledge();
            } else if (tabName === 'guide') {
                renderGuide();
            }
        }

        function filterQuestions(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            currentQuestionIndex = 0;
            renderQuestion();
        }

        function getFilteredQuestions() {
            if (currentFilter === 'all') {
                return allQuestions;
            }
            return allQuestions.filter(q => q.type === currentFilter);
        }

        function renderQuestion() {
            const questions = getFilteredQuestions();
            if (questions.length === 0) {
                document.getElementById('question-container').innerHTML = `
                    <div class="empty-state">
                        <div>📭</div>
                        <p>暂无匹配的题目</p>
                    </div>
                `;
                return;
            }

            const question = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            
            document.getElementById('practice-progress').style.width = progress + '%';
            document.getElementById('practice-text').textContent = `第 ${currentQuestionIndex + 1} / ${questions.length} 题`;

            const userAnswer = userAnswers[question.id];
            const hasAnswered = userAnswer !== undefined;

            let typeLabel = '单选题';
            let typeClass = 'type-single';
            if (question.type === 'multi') {
                typeLabel = '多选题';
                typeClass = 'type-multi';
            } else if (question.type === 'judge') {
                typeLabel = '判断题';
                typeClass = 'type-judge';
            }

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                let optionClass = 'option-item';
                if (hasAnswered) {
                    optionClass += ' disabled';
                    if (Array.isArray(question.answer)) {
                        if (question.answer.includes(index)) {
                            optionClass += ' correct';
                        }
                        if (Array.isArray(userAnswer) && userAnswer.includes(index)) {
                            if (!question.answer.includes(index)) {
                                optionClass += ' wrong';
                            }
                        }
                    } else {
                        if (index === question.answer) {
                            optionClass += ' correct';
                        }
                        if (userAnswer === index && index !== question.answer) {
                            optionClass += ' wrong';
                        }
                    }
                }
                if (!hasAnswered && Array.isArray(userAnswer) && userAnswer.includes(index)) {
                    optionClass += ' selected';
                } else if (!hasAnswered && userAnswer === index) {
                    optionClass += ' selected';
                }

                const letters = question.type === 'judge' ? ['✓', '✗'] : ['A', 'B', 'C', 'D', 'E', 'F'];
                
                optionsHtml += `
                    <li class="${optionClass}" onclick="selectOption(${index})">
                        <span class="option-letter">${letters[index]}</span>
                        <span class="option-text">${option}</span>
                    </li>
                `;
            });

            let answerSectionHtml = '';
            if (hasAnswered) {
                const isCorrect = Array.isArray(question.answer)
                    ? arraysEqual([...userAnswer].sort(), [...question.answer].sort())
                    : userAnswer === question.answer;
                
                const resultClass = isCorrect ? 'answer-correct' : 'answer-wrong';
                const resultText = isCorrect ? '✓ 回答正确' : '✗ 回答错误';
                
                const correctAnswerText = Array.isArray(question.answer)
                    ? question.answer.map(i => ['A', 'B', 'C', 'D', 'E', 'F'][i]).join(', ')
                    : ['A', 'B', 'C', 'D', 'E', 'F'][question.answer];

                answerSectionHtml = `
                    <div class="answer-section show ${resultClass}">
                        <div class="answer-header">${resultText}</div>
                        <div class="answer-content">
                            <p><strong>正确答案：</strong>${correctAnswerText}</p>
                            <p><strong>答案解析：</strong>${question.analysis}</p>
                        </div>
                    </div>
                `;
            }

            document.getElementById('question-container').innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-type ${typeClass}">${typeLabel}</span>
                        <span class="question-number">章节：${question.chapter}</span>
                    </div>
                    <div class="question-text">${question.id}. ${question.question}</div>
                    <ul class="options-list">${optionsHtml}</ul>
                    ${answerSectionHtml}
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>上一题</button>
                        ${hasAnswered ? 
                            '<button class="btn btn-primary" onclick="nextQuestion()">下一题</button>' :
                            '<button class="btn btn-success" onclick="submitAnswer()">提交答案</button>'
                        }
                    </div>
                </div>
            `;
        }

        function selectOption(index) {
            const questions = getFilteredQuestions();
            const question = questions[currentQuestionIndex];
            if (userAnswers[question.id] !== undefined) return;

            if (question.type === 'multi') {
                if (!userAnswers[question.id]) {
                    userAnswers[question.id] = [];
                }
                const idx = userAnswers[question.id].indexOf(index);
                if (idx > -1) {
                    userAnswers[question.id].splice(idx, 1);
                } else {
                    userAnswers[question.id].push(index);
                }
            } else {
                userAnswers[question.id] = index;
            }
            renderQuestion();
        }

        function submitAnswer() {
            const questions = getFilteredQuestions();
            const question = questions[currentQuestionIndex];
            if (userAnswers[question.id] === undefined || 
                (Array.isArray(userAnswers[question.id]) && userAnswers[question.id].length === 0)) {
                alert('请先选择答案');
                return;
            }
            saveProgress();
            updateStats();
            renderQuestion();
        }

        function prevQuestion() {
            const questions = getFilteredQuestions();
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            const questions = getFilteredQuestions();
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                alert('已经是最后一题了');
            }
        }

        function startExam() {
            examQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 30);
            examAnswers = {};
            remainingTime = 60 * 60;
            currentQuestionIndex = 0;
            
            document.getElementById('start-exam-btn').style.display = 'none';
            document.getElementById('exam-container').style.display = 'block';
            document.getElementById('exam-result').style.display = 'none';
            
            startTimer();
            renderExamQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingTime--;
                const minutes = Math.floor(remainingTime / 60);
                const seconds = remainingTime % 60;
                document.getElementById('exam-timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    finishExam();
                }
            }, 1000);
        }

        function renderExamQuestion() {
            const question = examQuestions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / examQuestions.length) * 100;
            
            document.getElementById('exam-container').innerHTML = `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progress}%"></div>
                </div>
                <div class="progress-text">第 ${currentQuestionIndex + 1} / ${examQuestions.length} 题</div>
            `;

            let typeLabel = '单选题';
            let typeClass = 'type-single';
            if (question.type === 'multi') {
                typeLabel = '多选题';
                typeClass = 'type-multi';
            } else if (question.type === 'judge') {
                typeLabel = '判断题';
                typeClass = 'type-judge';
            }

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                let optionClass = 'option-item';
                if (Array.isArray(examAnswers[question.id]) && examAnswers[question.id].includes(index)) {
                    optionClass += ' selected';
                } else if (examAnswers[question.id] === index) {
                    optionClass += ' selected';
                }

                const letters = question.type === 'judge' ? ['✓', '✗'] : ['A', 'B', 'C', 'D', 'E', 'F'];
                
                optionsHtml += `
                    <li class="${optionClass}" onclick="selectExamOption(${index})">
                        <span class="option-letter">${letters[index]}</span>
                        <span class="option-text">${option}</span>
                    </li>
                `;
            });

            document.getElementById('exam-container').innerHTML += `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-type ${typeClass}">${typeLabel}</span>
                        <span class="question-number">章节：${question.chapter}</span>
                    </div>
                    <div class="question-text">${question.id}. ${question.question}</div>
                    <ul class="options-list">${optionsHtml}</ul>
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="prevExamQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>上一题</button>
                        ${currentQuestionIndex === examQuestions.length - 1 ? 
                            '<button class="btn btn-danger" onclick="finishExam()">交卷</button>' :
                            '<button class="btn btn-primary" onclick="nextExamQuestion()">下一题</button>'
                        }
                    </div>
                </div>
            `;
        }

        function selectExamOption(index) {
            const question = examQuestions[currentQuestionIndex];
            if (question.type === 'multi') {
                if (!examAnswers[question.id]) {
                    examAnswers[question.id] = [];
                }
                const idx = examAnswers[question.id].indexOf(index);
                if (idx > -1) {
                    examAnswers[question.id].splice(idx, 1);
                } else {
                    examAnswers[question.id].push(index);
                }
            } else {
                examAnswers[question.id] = index;
            }
            renderExamQuestion();
        }

        function prevExamQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderExamQuestion();
            }
        }

        function nextExamQuestion() {
            if (currentQuestionIndex < examQuestions.length - 1) {
                currentQuestionIndex++;
                renderExamQuestion();
            }
        }

        function finishExam() {
            if (timerInterval) clearInterval(timerInterval);
            
            let correctCount = 0;
            let wrongQuestions = [];
            
            examQuestions.forEach(question => {
                const userAnswer = examAnswers[question.id];
                const isCorrect = Array.isArray(question.answer)
                    ? arraysEqual([...userAnswer].sort(), [...question.answer].sort())
                    : userAnswer === question.answer;
                
                if (isCorrect) {
                    correctCount++;
                } else {
                    wrongQuestions.push(question);
                }
                
                userAnswers[question.id] = userAnswer;
            });
            
            saveProgress();
            updateStats();
            
            const score = Math.round((correctCount / examQuestions.length) * 100);
            
            document.getElementById('exam-container').style.display = 'none';
            document.getElementById('exam-result').style.display = 'block';
            document.getElementById('start-exam-btn').style.display = 'block';
            
            document.getElementById('exam-result').innerHTML = `
                <div class="result-card">
                    <div class="result-score">${score}</div>
                    <div class="result-text">${score >= 60 ? '🎉 恭喜通过！' : '💪 继续努力！'}</div>
                    <div class="result-details">
                        <div class="detail-item">
                            <div class="detail-value">${correctCount}</div>
                            <div class="detail-label">正确</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${examQuestions.length - correctCount}</div>
                            <div class="detail-label">错误</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">${Math.round((correctCount / examQuestions.length) * 100)}%</div>
                            <div class="detail-label">正确率</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="startExam()">再考一次</button>
                </div>
            `;
        }

        function renderWrongQuestions() {
            const wrongQuestions = getWrongQuestions();
            
            if (wrongQuestions.length === 0) {
                document.getElementById('wrong-container').innerHTML = `
                    <div class="empty-state">
                        <div>🎉</div>
                        <p>暂无错题，继续保持！</p>
                    </div>
                `;
                return;
            }
            
            let html = '<ul class="wrong-list">';
            wrongQuestions.forEach((question, index) => {
                const userAnswer = userAnswers[question.id];
                const correctAnswerText = Array.isArray(question.answer)
                    ? question.answer.map(i => ['A', 'B', 'C', 'D', 'E', 'F'][i]).join(', ')
                    : ['A', 'B', 'C', 'D', 'E', 'F'][question.answer];
                
                html += `
                    <li class="wrong-item">
                        <strong>${index + 1}. ${question.question}</strong>
                        <p style="margin-top: 5px; color: #666; font-size: 14px;">
                            你的答案：${userAnswer !== undefined ? (Array.isArray(userAnswer) ? userAnswer.map(i => ['A', 'B', 'C', 'D', 'E', 'F'][i]).join(', ') : ['A', 'B', 'C', 'D', 'E', 'F'][userAnswer]) : '未作答'} | 
                            正确答案：<span style="color: #66bb6a;">${correctAnswerText}</span>
                        </p>
                        <p style="margin-top: 5px; color: #888; font-size: 13px;">${question.analysis}</p>
                    </li>
                `;
            });
            html += '</ul>';
            
            document.getElementById('wrong-container').innerHTML = html;
        }

        function clearWrongQuestions() {
            if (confirm('确定要清空错题集吗？')) {
                localStorage.removeItem('communication_exam_progress');
                userAnswers = {};
                updateStats();
                renderWrongQuestions();
            }
        }

        function renderReview() {
            const chapters = {};
            allQuestions.forEach(question => {
                if (!chapters[question.chapter]) {
                    chapters[question.chapter] = { total: 0, done: 0, correct: 0 };
                }
                chapters[question.chapter].total++;
                
                const userAnswer = userAnswers[question.id];
                if (userAnswer !== undefined) {
                    chapters[question.chapter].done++;
                    const isCorrect = Array.isArray(question.answer)
                        ? arraysEqual([...userAnswer].sort(), [...question.answer].sort())
                        : userAnswer === question.answer;
                    if (isCorrect) {
                        chapters[question.chapter].correct++;
                    }
                }
            });
            
            let html = '';
            for (const [chapter, stats] of Object.entries(chapters)) {
                const accuracy = stats.done > 0 ? Math.round((stats.correct / stats.done) * 100) : 0;
                const progress = (stats.done / stats.total) * 100;
                
                html += `
                    <div style="background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h4 style="color: #333;">${chapter}</h4>
                            <span style="color: #667eea; font-weight: bold;">${stats.done}/${stats.total}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px;">
                            <span style="color: #666;">正确率：${accuracy}%</span>
                            <span style="color: #66bb6a;">正确：${stats.correct}</span>
                            <span style="color: #ef5350;">错误：${stats.done - stats.correct}</span>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('review-container').innerHTML = html;
        }

        let knowledgeFilter = 'all';

        function filterKnowledge(type) {
            knowledgeFilter = type;
            document.querySelectorAll('#tab-knowledge .filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            renderKnowledge();
        }

        function renderKnowledge() {
            let filtered = knowledgePoints;
            if (knowledgeFilter === '基础') {
                filtered = knowledgePoints.filter(k => k.category === '基础');
            } else if (knowledgeFilter === '传输') {
                filtered = knowledgePoints.filter(k => k.category === '传输');
            } else if (knowledgeFilter === '交换') {
                filtered = knowledgePoints.filter(k => k.category === '交换');
            } else if (knowledgeFilter === '接入') {
                filtered = knowledgePoints.filter(k => k.category === '接入');
            } else if (knowledgeFilter === '移动') {
                filtered = knowledgePoints.filter(k => k.category === '移动');
            } else if (knowledgeFilter === '数据') {
                filtered = knowledgePoints.filter(k => k.category === '数据');
            }

            let html = '';
            filtered.forEach(kp => {
                const keyPointsHtml = kp.keyPoints.map(kp => `<li>• ${kp}</li>`).join('');
                
                html += `
                    <div style="background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); border-left: 4px solid #667eea;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h4 style="color: #333; font-size: 18px; margin: 0;">📚 ${kp.title}</h4>
                            <span style="background: #e3f2fd; color: #1565c0; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">${kp.chapter}</span>
                        </div>
                        <p style="color: #555; line-height: 1.8; margin-bottom: 15px; font-size: 15px;">${kp.content}</p>
                        <div style="background: #f8f9fa; border-radius: 8px; padding: 15px;">
                            <h5 style="color: #333; margin-bottom: 10px; font-size: 14px;">✨ 重点要点</h5>
                            <ul style="list-style: none; padding: 0; margin: 0;">
                                ${keyPointsHtml}
                            </ul>
                        </div>
                    </div>
                `;
            });

            document.getElementById('knowledge-container').innerHTML = html;
        }

        function renderGuide() {
            let html = '';

            html += `
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 15px; padding: 30px; margin-bottom: 25px;">
                    <h3 style="font-size: 22px; margin-bottom: 15px;">${examGuide.overview.title}</h3>
                    <p style="line-height: 1.8; font-size: 16px; opacity: 0.95;">${examGuide.overview.content}</p>
                </div>

                <h3 style="color: #333; margin-bottom: 20px; font-size: 20px;">📖 考试科目</h3>
            `;

            examGuide.subjects.forEach(subject => {
                const typesHtml = subject.questionTypes.map(t => `<span style="background: #e3f2fd; color: #1565c0; padding: 4px 10px; border-radius: 15px; font-size: 12px; margin-right: 8px;">${t}</span>`).join('');
                
                html += `
                    <div style="background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); border-left: 4px solid #4caf50;">
                        <h4 style="color: #333; font-size: 18px; margin-bottom: 10px;">📝 ${subject.name}</h4>
                        <p style="color: #666; font-size: 14px; margin-bottom: 10px;"><strong>简介：</strong>${subject.description}</p>
                        <p style="color: #555; line-height: 1.7; margin-bottom: 15px;">${subject.content}</p>
                        <div style="margin-top: 15px;">
                            <span style="color: #666; font-size: 14px; font-weight: bold;">考查题型：</span>
                            ${typesHtml}
                        </div>
                    </div>
                `;
            });

            html += `
                <h3 style="color: #333; margin-bottom: 20px; font-size: 20px;">🎯 题型解读</h3>
            `;

            examGuide.questionTypes.forEach(qType => {
                let examplesHtml = '';
                qType.examples.forEach((ex, idx) => {
                    examplesHtml += `
                        <div style="background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 10px;">
                            <p style="color: #333; font-weight: 500; margin-bottom: 8px;">${idx + 1}. ${ex.question}</p>
                            <p style="color: #66bb6a; font-weight: bold; font-size: 14px;">答案：${ex.answer}</p>
                            <p style="color: #888; font-size: 13px; margin-top: 5px;">解析：${ex.analysis}</p>
                        </div>
                    `;
                });

                html += `
                    <div style="background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); border-left: 4px solid #ff9800;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h4 style="color: #333; font-size: 18px;">📌 ${qType.type}</h4>
                            <span style="background: #fff3e0; color: #ef6c00; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">${qType.description}</span>
                        </div>
                        <div style="background: #fff3e0; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
                            <h5 style="color: #e65100; margin-bottom: 8px; font-size: 14px;">💡 答题技巧</h5>
                            <p style="color: #666; font-size: 14px; line-height: 1.7;">${qType.tips}</p>
                        </div>
                        <h5 style="color: #333; margin-bottom: 10px; font-size: 14px;">📝 示例</h5>
                        ${examplesHtml}
                    </div>
                `;
            });

            html += `
                <h3 style="color: #333; margin-bottom: 20px; font-size: 20px;">📋 备考建议</h3>
            `;

            examGuide.preparationTips.forEach(tip => {
                html += `
                    <div style="background: #e8f5e9; border-radius: 10px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #66bb6a;">
                        <h4 style="color: #2e7d32; font-size: 16px; margin-bottom: 10px;">✅ ${tip.title}</h4>
                        <p style="color: #555; line-height: 1.7;">${tip.content}</p>
                    </div>
                `;
            });

            document.getElementById('guide-container').innerHTML = html;
        }

        window.onload = init;
    </script>
</body>
</html>
