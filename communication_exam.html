<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通信专业技术人员职业水平考试（初级）题库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .sidebar h3 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .nav-item {
            display: block;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: #667eea;
            color: white;
        }

        .stats {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
        }

        .content-area {
            flex: 1;
            min-width: 500px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .question-card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #667eea;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-type {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .type-single {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .type-multi {
            background: #e3f2fd;
            color: #1565c0;
        }

        .type-judge {
            background: #fff3e0;
            color: #ef6c00;
        }

        .question-number {
            font-size: 14px;
            color: #666;
        }

        .question-text {
            font-size: 16px;
            color: #333;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .option-item:hover {
            background: #e3f2fd;
            border-color: #90caf9;
        }

        .option-item.selected {
            background: #e8f5e9;
            border-color: #66bb6a;
        }

        .option-item.correct {
            background: #e8f5e9 !important;
            border-color: #66bb6a !important;
        }

        .option-item.wrong {
            background: #ffebee !important;
            border-color: #ef5350 !important;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            font-weight: bold;
            font-size: 14px;
        }

        .option-text {
            font-size: 15px;
            color: #333;
            padding-top: 4px;
        }

        .option-item.selected .option-letter {
            background: #66bb6a;
        }

        .option-item.correct .option-letter {
            background: #66bb6a;
        }

        .option-item.wrong .option-letter {
            background: #ef5350;
        }

        .answer-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .answer-section.show {
            display: block;
        }

        .answer-correct {
            background: #e8f5e9;
            border-left: 4px solid #66bb6a;
        }

        .answer-wrong {
            background: #ffebee;
            border-left: 4px solid #ef5350;
        }

        .answer-header {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .answer-correct .answer-header {
            color: #2e7d32;
        }

        .answer-wrong .answer-header {
            color: #c62828;
        }

        .answer-content {
            color: #555;
            line-height: 1.7;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #66bb6a;
            color: white;
        }

        .btn-success:hover {
            background: #4caf50;
        }

        .btn-danger {
            background: #ef5350;
            color: white;
        }

        .btn-danger:hover {
            background: #e53935;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .exam-mode {
            background: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ff9800;
        }

        .exam-mode h4 {
            color: #e65100;
            margin-bottom: 10px;
        }

        .exam-info {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }

        .result-card {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-top: 30px;
        }

        .result-score {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .result-text {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .result-details {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-value {
            font-size: 24px;
            font-weight: bold;
        }

        .detail-label {
            font-size: 14px;
            opacity: 0.8;
        }

        .wrong-list {
            list-style: none;
        }

        .wrong-item {
            padding: 15px;
            background: #fff3e0;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ff9800;
        }

        .wrong-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .wrong-item a:hover {
            text-decoration: underline;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .filter-tab:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #ef5350;
            text-align: center;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .content-area {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📡 通信专业技术人员职业水平考试（初级）题库</h1>
            <p>涵盖通信基础、传输系统、交换技术、接入网、移动通信、数据通信等核心知识</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>📚 学习导航</h3>
                <div class="nav-item active" onclick="switchTab('practice')">📝 章节练习</div>
                <div class="nav-item" onclick="switchTab('exam')">🎯 模拟考试</div>
                <div class="nav-item" onclick="switchTab('wrong')">❌ 错题集</div>
                <div class="nav-item" onclick="switchTab('review')">📋 复习进度</div>

                <div class="stats">
                    <h4>📊 学习统计</h4>
                    <div class="stat-item">
                        <span class="stat-label">总题数</span>
                        <span class="stat-value" id="stat-total">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">已做题</span>
                        <span class="stat-value" id="stat-done">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">正确率</span>
                        <span class="stat-value" id="stat-accuracy">0%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">错题数</span>
                        <span class="stat-value" id="stat-wrong">0</span>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div id="tab-practice" class="tab-content active">
                    <div class="filter-tabs">
                        <div class="filter-tab active" onclick="filterQuestions('all')">全部</div>
                        <div class="filter-tab" onclick="filterQuestions('single')">单选题</div>
                        <div class="filter-tab" onclick="filterQuestions('multi')">多选题</div>
                        <div class="filter-tab" onclick="filterQuestions('judge')">判断题</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="practice-progress"></div>
                    </div>
                    <div class="progress-text" id="practice-text"></div>
                    <div id="question-container"></div>
                </div>

                <div id="tab-exam" class="tab-content">
                    <div class="exam-mode">
                        <h4>🎯 模拟考试模式</h4>
                        <div class="exam-info">
                            <span>⏱️ 考试时长：60分钟</span>
                            <span>📝 题目数量：30题</span>
                            <span>💯 满分：100分</span>
                        </div>
                    </div>
                    <div class="timer" id="exam-timer">60:00</div>
                    <button class="btn btn-primary" onclick="startExam()" id="start-exam-btn">开始考试</button>
                    <div id="exam-container" style="display: none;"></div>
                    <div id="exam-result" style="display: none;"></div>
                </div>

                <div id="tab-wrong" class="tab-content">
                    <h3 style="margin-bottom: 20px;">❌ 错题集</h3>
                    <button class="btn btn-danger" onclick="clearWrongQuestions()" style="margin-bottom: 20px;">清空错题集</button>
                    <div id="wrong-container"></div>
                </div>

                <div id="tab-review" class="tab-content">
                    <h3 style="margin-bottom: 20px;">📋 复习进度</h3>
                    <div id="review-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const allQuestions = [
            {
                id: 1,
                type: 'single',
                chapter: '通信基础',
                question: '在5G NR中，用于承载系统消息广播的物理信道是？',
                options: ['PBCH', 'PDSCH', 'PDCCH', 'PRACH'],
                answer: 0,
                analysis: 'PBCH（Physical Broadcast Channel）固定位于SSB内，用于广播MIB，是终端初始接入的必备信息。'
            },
            {
                id: 2,
                type: 'single',
                chapter: '通信基础',
                question: '下列关于OSI七层模型的描述，正确的是？',
                options: [
                    '传输层仅提供无连接服务',
                    '数据链路层可进行路由选择',
                    '网络层负责端到端可靠传输',
                    '会话层管理通信会话'
                ],
                answer: 3,
                analysis: '会话层建立、管理和终止会话；传输层提供面向连接与无连接两种服务；路由选择属网络层；端到端可靠传输由传输层完成。'
            },
            {
                id: 3,
                type: 'single',
                chapter: '数据通信',
                question: '在IPv6地址中，用于表示"链路本地单播"的前缀为？',
                options: ['FE80::/10', 'FC00::/7', '2000::/3', 'FF00::/8'],
                answer: 0,
                analysis: 'FE80::/10为链路本地地址，仅在本地链路有效，用于邻居发现等机制。'
            },
            {
                id: 4,
                type: 'single',
                chapter: '通信基础',
                question: '下列调制方式中，频带利用率最高的是？',
                options: ['BPSK', 'QPSK', '16QAM', '256QAM'],
                answer: 3,
                analysis: '256QAM每符号携带8 bit，频谱效率最高，但对信道条件要求也最苛刻。'
            },
            {
                id: 5,
                type: 'single',
                chapter: '传输系统',
                question: '在SDH帧结构中，用于指示低阶通道误码的字节是？',
                options: ['B1', 'B2', 'B3', 'V5'],
                answer: 3,
                analysis: 'B3字节位于高阶通道开销，用于BIP-8校验，检测高阶通道误码；V5用于低阶通道。'
            },
            {
                id: 6,
                type: 'single',
                chapter: '数据通信',
                question: '当TCP发送端检测到快速重传时，拥塞窗口cwnd应？',
                options: ['置为1', '减半后进入拥塞避免', '置为ssthresh', '保持不变'],
                answer: 1,
                analysis: '收到3个冗余ACK触发快速重传，cwnd减半后设为ssthresh，随后线性增长。'
            },
            {
                id: 7,
                type: 'single',
                chapter: '移动通信',
                question: '在LTE中，UE初始接入时发送的随机接入前导称为？',
                options: ['Msg1', 'Msg2', 'Msg3', 'Msg4'],
                answer: 0,
                analysis: 'Msg1为PRACH上发送的随机接入前导，Msg2为RAR，Msg3为RRC连接请求，Msg4为竞争解决。'
            },
            {
                id: 8,
                type: 'single',
                chapter: '传输系统',
                question: '下列关于天线增益的描述，错误的是？',
                options: [
                    '与方向性有关',
                    '单位可为dBi',
                    '越高覆盖越远',
                    '与输入功率成正比'
                ],
                answer: 3,
                analysis: '增益是相对量，与输入功率无关；提高增益可延长覆盖，但牺牲波束宽度。'
            },
            {
                id: 9,
                type: 'single',
                chapter: '传输系统',
                question: '在PTN网络中，用于提供端到端以太网业务的隧道技术是？',
                options: ['LSP', 'PW', 'VRF', 'RSVP'],
                answer: 1,
                analysis: 'PW（Pseudowire）仿真以太网业务，LSP为其提供隧道载体。'
            },
            {
                id: 10,
                type: 'single',
                chapter: '通信基础',
                question: '下列哪项不是NFV的核心优势？',
                options: ['硬件通用化', '弹性伸缩', '降低功耗', '增加物理端口密度'],
                answer: 3,
                analysis: 'NFV通过软件化减少专用设备，端口密度由交换机决定，非其直接优势。'
            },
            {
                id: 11,
                type: 'single',
                chapter: '传输系统',
                question: '在光通信中，引起四波混频FWM的主要因素是？',
                options: ['光纤色散', '光纤非线性', '偏振模色散', '衰减'],
                answer: 1,
                analysis: 'FWM源于三阶非线性极化，与功率、信道间隔、色散有关，但根本原因是非线性。'
            },
            {
                id: 12,
                type: 'single',
                chapter: '交换技术',
                question: '当交换机收到未知单播帧时，默认行为是？',
                options: ['丢弃', '泛洪', '回送', '请求ARP'],
                answer: 1,
                analysis: '未知单播在MAC表无匹配项，交换机泛洪到同一VLAN所有端口。'
            },
            {
                id: 13,
                type: 'single',
                chapter: '移动通信',
                question: '在5G核心网中，负责会话管理的网元是？',
                options: ['AMF', 'SMF', 'UPF', 'AUSF'],
                answer: 1,
                analysis: 'SMF（Session Management Function）负责PDU会话建立、修改、释放。'
            },
            {
                id: 14,
                type: 'single',
                chapter: '接入网',
                question: '下列关于PoE的说法，正确的是？',
                options: [
                    '802.3af最高输出30W',
                    '802.3bt Type4可达90W',
                    '使用3、4、5、6线对供电',
                    '不能通过千兆链路'
                ],
                answer: 1,
                analysis: '802.3bt Type4上限90W；802.3af为15.4W；供电使用1、2、3、6或4、5、7、8；千兆兼容。'
            },
            {
                id: 15,
                type: 'single',
                chapter: '传输系统',
                question: '在卫星通信中，造成最大自由空间损耗的频段是？',
                options: ['L', 'S', 'C', 'Ka'],
                answer: 3,
                analysis: '自由空间损耗与频率平方成正比，Ka频段最高，损耗最大。'
            },
            {
                id: 16,
                type: 'single',
                chapter: '通信基础',
                question: '下列关于区块链在电信领域应用的说法，错误的是？',
                options: [
                    '可提升漫游结算效率',
                    '可降低号码携带成本',
                    '可完全替代BOSS系统',
                    '可增强用户隐私保护'
                ],
                answer: 2,
                analysis: '区块链尚无法承载BOSS实时计费、客服等全部功能，只能作为补充。'
            },
            {
                id: 17,
                type: 'single',
                chapter: '数据通信',
                question: '在Linux系统中，查看本机路由表的命令是？',
                options: ['route -n', 'ipconfig', 'netstat -a', 'traceroute'],
                answer: 0,
                analysis: 'route -n或ip route show均可查看内核路由表；ipconfig为Windows命令。'
            },
            {
                id: 18,
                type: 'single',
                chapter: '移动通信',
                question: '下列关于MIMO技术的说法，正确的是？',
                options: [
                    '仅适用于TDD系统',
                    '天线数越多速率一定越高',
                    '可提升频谱效率',
                    '必须同频组网'
                ],
                answer: 2,
                analysis: 'MIMO利用空间复用提升频谱效率；FDD亦支持；速率受限于信道秩；异频也可应用。'
            },
            {
                id: 19,
                type: 'single',

        let currentFilter = 'all';
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let examQuestions = [];
        let examAnswers = {};
        let timerInterval = null;
        let remainingTime = 60 * 60;

        function init() {
            loadProgress();
            updateStats();
            renderQuestion();
        }

        function loadProgress() {
            const saved = localStorage.getItem('communication_exam_progress');
            if (saved) {
                userAnswers = JSON.parse(saved);
            }
        }

        function saveProgress() {
            localStorage.setItem('communication_exam_progress', JSON.stringify(userAnswers));
        }

        function getWrongQuestions() {
            const wrong = [];
            for (const [id, answer] of Object.entries(userAnswers)) {
                const question = allQuestions.find(q => q.id === parseInt(id));
                if (question) {
                    const isCorrect = Array.isArray(question.answer)
                        ? arraysEqual(answer, question.answer)
                        : answer === question.answer;
                    if (!isCorrect) {
                        wrong.push(question);
                    }
                }
            }
            return wrong;
        }

        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            return a.every((val, idx) => val === b[idx]);
        }

        function updateStats() {
            const total = allQuestions.length;
            const done = Object.keys(userAnswers).length;
            
            let correctCount = 0;
            for (const [id, answer] of Object.entries(userAnswers)) {
                const question = allQuestions.find(q => q.id === parseInt(id));
                if (question) {
                    const isCorrect = Array.isArray(question.answer)
                        ? arraysEqual(answer.sort(), question.answer.sort())
                        : answer === question.answer;
                    if (isCorrect) correctCount++;
                }
            }

            const accuracy = done > 0 ? Math.round((correctCount / done) * 100) : 0;
            const wrong = done - correctCount;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent = done;
            document.getElementById('stat-accuracy').textContent = accuracy + '%';
            document.getElementById('stat-wrong').textContent = wrong;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');

            if (tabName === 'practice') {
                renderQuestion();
            } else if (tabName === 'wrong') {
                renderWrongQuestions();
            } else if (tabName === 'review') {
                renderReview();
            }
        }

        function filterQuestions(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            currentQuestionIndex = 0;
            renderQuestion();
        }

        function getFilteredQuestions() {
            if (currentFilter === 'all') {
                return allQuestions;
            }
            return allQuestions.filter(q => q.type === currentFilter);
        }

        function renderQuestion() {
            const questions = getFilteredQuestions();
            if (questions.length === 0) {
                document.getElementById('question-container').innerHTML = `
                    <div class="empty-state">
                        <div>📭</div>
                        <p>暂无匹配的题目</p>
                    </div>
                `;
                return;
            }

            const question = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            
            document.getElementById('practice-progress').style.width = progress + '%';
            document.getElementById('practice-text').textContent = `第 ${currentQuestionIndex + 1} / ${questions.length} 题`;

            const userAnswer = userAnswers[question.id];
            const hasAnswered = userAnswer !== undefined;

            let typeLabel = '单选题';
            let typeClass = 'type-single';
            if (question.type === 'multi') {
                typeLabel = '多选题';
                typeClass = 'type-multi';
            } else if (question.type === 'judge') {
                typeLabel = '判断题';
                typeClass = 'type-judge';
            }

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                let optionClass = 'option-item';
                if (hasAnswered) {
                    optionClass += ' disabled';
                    if (Array.isArray(question.answer)) {
                        if (question.answer.includes(index)) {
                            optionClass += ' correct';
                        }
                        if (Array.isArray(userAnswer) && userAnswer.includes(index)) {
                            if (!question.answer.includes(index)) {
                                optionClass += ' wrong';
                            }
                        }
                    } else {
                        if (index === question.answer) {
                            optionClass += ' correct';
                        }
                        if (userAnswer === index && index !== question.answer) {
                            optionClass += ' wrong';
                        }
                    }
                }
                if (!hasAnswered && Array.isArray(userAnswer) && userAnswer.includes(index)) {
                    optionClass += ' selected';
                } else if (!hasAnswered && userAnswer === index) {
                    optionClass += ' selected';
                }

                const letters = question.type === 'judge' ? ['✓', '✗'] : ['A', 'B', 'C', 'D', 'E', 'F'];
                
                optionsHtml += `
                    <li class="${optionClass}" onclick="selectOption(${index})">
                        <span class="option-letter">${letters[index]}</span>
                        <span class="option-text">${option}</span>
                    </li>
                `;
            });

            let answerSectionHtml = '';
            if (hasAnswered) {
                const isCorrect = Array.isArray(question.answer)
                    ? arraysEqual([...userAnswer].sort(), [...question.answer].sort())
                    : userAnswer === question.answer;
                
                const resultClass = isCorrect ? 'answer-correct' : 'answer-wrong';
                const resultText = isCorrect ? '✓ 回答正确' : '✗ 回答错误';
                
                const correctAnswerText = Array.isArray(question.answer)
                    ? question.answer.map(i => ['A', 'B', 'C', 'D', 'E', 'F'][i]).join(', ')
                    : ['A', 'B', 'C', 'D', 'E', 'F'][question.answer];

                answerSectionHtml = `
                    <div class="answer-section show ${resultClass}">
                        <div class="answer-header">${resultText}</div>
                        <div class="answer-content">
                            <p><strong>正确答案：</strong>${correctAnswerText}</p>
                            <p><strong>答案解析：</strong>${question.analysis}</p>
                        </div>
                    </div>
                `;
            }

            document.getElementById('question-container').innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-type ${typeClass}">${typeLabel}</span>
                        <span class="question-number">章节：${question.chapter}</span>
                    </div>
                    <div class="question-text">${question.id}. ${question.question}</div>
                    <ul class="options-list">${optionsHtml}</ul>
                    ${answerSectionHtml}
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>上一题</button>
                        ${hasAnswered ? 
                            '<button class="btn btn-primary" onclick="nextQuestion()">下一题</button>' :
                            '<button class="btn btn-success" onclick="submitAnswer()">提交答案</button>'
                        }
                    </div>
                </div>
            `;
        }

        function selectOption(index) {
            const questions = getFilteredQuestions();
            const question = questions[currentQuestionIndex];
            if (userAnswers[question.id] !== undefined) return;

            if (question.type === 'multi') {
                if (!userAnswers[question.id]) {
                    userAnswers[question.id] = [];
                }
                const idx = userAnswers[question.id].indexOf(index);
                if (idx > -1) {
                    userAnswers[question.id].splice(idx, 1);
                } else {
                    userAnswers[question.id].push(index);
                }
            } else {
                userAnswers[question.id] = index;
            }
            renderQuestion();
        }

        function submitAnswer() {
            const questions = getFilteredQuestions();
            const question = questions[currentQuestionIndex];
            if (userAnswers[question.id] === undefined || 
                (Array.isArray(userAnswers[question.id]) && userAnswers[question.id].length === 0)) {
                alert('请先选择答案');
                return;
            }
            saveProgress();
            updateStats();
            renderQuestion();
        }

        function prevQuestion() {
            const questions = getFilteredQuestions();
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            const questions = getFilteredQuestions();
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                alert('已经是最后一题了');
            }
        }

        function startExam() {
            examQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 30);
            examAnswers = {};
            remainingTime = 60 * 60;
            currentQuestionIndex = 0;
            
            document.getElementById('start-exam-btn').style.display = 'none';
            document.getElementById('exam-container').style.display = 'block';
            document.getElementById('exam-result').style.display = 'none';
            
            startTimer();
            renderExamQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingTime--;
                const minutes = Math.floor(remainingTime / 60);
                const seconds = remainingTime % 60;
                document.getElementById('exam-timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    finishExam();
                }
            }, 1000);
        }

                typeClass = 'type-judge';

                } else if (examAnswers[question.id] === index) {
                    optionClass += ' selected';
                }

                const letters = question.type === 'judge' ? ['✓', '✗'] : ['A', 'B', 'C', 'D', 'E', 'F'];
                
                optionsHtml += `
                    <li class="${optionClass}" onclick="selectExamOption(${index})">
                        <span class="option-letter">${letters[index]}</span>
                        <span class="option-text">${option}</span>
                    </li
